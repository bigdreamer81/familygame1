<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1033">
<title>Family Dash</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 20% -10%, #3b2a6d 0%, #1a1033 45%, #0d0820 100%);
    color:#fff; overflow:hidden;
    display:flex; justify-content:center;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    touch-action: manipulation;
  }
  #app {
    position:relative; width:100%; max-width:480px; height:100dvh;
    overflow:hidden; display:flex; flex-direction:column;
    --accent:#ffd166;
  }
  @media (min-width: 520px) {
    #app { height:min(100dvh, 940px); margin:auto; border-radius:24px;
           box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08); }
  }

  /* ---------- shared ---------- */
  .screen { position:absolute; inset:0; display:none; flex-direction:column; padding:max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); }
  .screen.active { display:flex; }
  h1,h2,h3 { font-weight:800; letter-spacing:-.02em; }
  button { font-family:inherit; color:inherit; background:none; border:none; cursor:pointer; touch-action:manipulation; }
  .btn {
    display:block; width:100%; padding:15px 18px; border-radius:16px;
    font-size:17px; font-weight:800; text-align:center;
    background:linear-gradient(135deg, var(--accent), #ff7b54);
    color:#1a1033; box-shadow:0 6px 0 rgba(0,0,0,.35);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.35); }
  .btn.ghost { background:rgba(255,255,255,.1); color:#fff; box-shadow:0 6px 0 rgba(0,0,0,.25); }
  .btn-row { display:flex; gap:10px; }
  .btn-row .btn { flex:1; }
  .screen-head { display:flex; align-items:center; gap:12px; margin-bottom:10px; min-height:44px; }
  .screen-head h2 { font-size:22px; flex:1; }
  .back-btn {
    width:42px; height:42px; border-radius:14px; font-size:20px; font-weight:800;
    background:rgba(255,255,255,.1); flex:none;
  }
  #muteBtn {
    position:absolute; top:max(12px, env(safe-area-inset-top)); right:14px; z-index:60;
    width:42px; height:42px; border-radius:14px; font-size:19px;
    background:rgba(255,255,255,.12); backdrop-filter:blur(6px);
  }
  /* keep the HUD clear during play — mute lives on menu screens */
  #app:has(#screen-game.active) #muteBtn,
  #app:has(#screen-race.active) #muteBtn { display:none; }

  /* ---------- title ---------- */
  #screen-title { justify-content:center; text-align:center; gap:18px; }
  .emoji-row { display:flex; flex-wrap:wrap; justify-content:center; gap:2px; font-size:clamp(19px, 5.6vw, 26px); }
  .emoji-row span { animation:bob 1.6s ease-in-out infinite; display:inline-block; }
  .emoji-row span:nth-child(2n){ animation-delay:.2s } .emoji-row span:nth-child(3n){ animation-delay:.4s }
  .emoji-row span:nth-child(4n){ animation-delay:.6s } .emoji-row span:nth-child(5n){ animation-delay:.1s }
  @keyframes bob { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-9px) } }
  .logo {
    font-size:clamp(44px, 13vw, 60px); line-height:.95;
    background:linear-gradient(135deg, #ffd166, #ff7b54 55%, #ff4f9a);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 4px 14px rgba(255,123,84,.35));
  }
  .tagline-main { color:rgba(255,255,255,.75); font-size:15px; font-weight:600; margin-top:-6px; }
  .mode-cards { display:flex; flex-direction:column; gap:12px; margin-top:8px; }
  .mode-card {
    display:flex; align-items:center; gap:14px; text-align:left;
    padding:16px; border-radius:20px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
    transition:transform .08s;
  }
  .mode-card:active { transform:scale(.97); }
  .mode-card .mc-emoji { font-size:38px; }
  .mode-card b { font-size:19px; display:block; }
  .mode-card span { font-size:13px; color:rgba(255,255,255,.7); font-weight:500; line-height:1.35; display:block; margin-top:2px; }
  .credits { font-size:12px; color:rgba(255,255,255,.45); font-weight:600; }

  /* ---------- character select ---------- */
  #charGrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; overflow-y:auto; padding-bottom:8px; align-content:start; flex:1; }
  .char-card {
    position:relative; padding:14px 10px 12px; border-radius:18px; text-align:center;
    background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.1);
    transition:transform .08s;
  }
  .char-card:active { transform:scale(.95); }
  .char-card .cc-emoji { font-size:42px; display:block; }
  .char-card .cc-name { font-size:17px; font-weight:800; margin-top:4px; display:block; }
  .char-card .cc-tag { font-size:11px; color:rgba(255,255,255,.65); font-weight:600; line-height:1.3; display:block; margin-top:3px; min-height:28px; }
  .char-card .cc-best { position:absolute; top:8px; right:8px; font-size:10px; font-weight:800; background:rgba(255,209,102,.2); color:#ffd166; padding:3px 6px; border-radius:8px; }

  /* ---------- game ---------- */
  #screen-game { padding:0; }
  #gameHud {
    display:flex; align-items:center; padding:max(10px, env(safe-area-inset-top)) 14px 8px; gap:10px;
  }
  .hud-box { background:rgba(0,0,0,.3); border-radius:12px; padding:6px 11px; font-weight:800; }
  #hudTime { font-size:18px; min-width:52px; text-align:center; display:block; }
  #hudTime.low { color:#ff6b6b; animation:pulse .5s infinite; }
  .hud-mid { flex:1; text-align:center; }
  #hudScore { font-size:26px; font-weight:900; display:block; line-height:1; }
  #hudCharName { font-size:10.5px; color:rgba(255,255,255,.6); font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
  #hudStreak { font-size:15px; min-width:58px; text-align:center; display:block; color:#ffd166; }
  @keyframes pulse { 50%{ opacity:.5 } }

  #gameArea {
    position:relative; flex:1; overflow:hidden; touch-action:none;
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.25));
    border-top:1px solid rgba(255,255,255,.08); border-bottom:1px solid rgba(255,255,255,.08);
  }
  .lane-lines { position:absolute; inset:0; display:flex; pointer-events:none; }
  .lane-lines i { flex:1; border-right:2px dashed rgba(255,255,255,.07); }
  .lane-lines i:last-child { border-right:none; }

  .item {
    position:absolute; top:0; left:50%; transform:translate(-50%,-60px);
    font-size:clamp(32px, 9vw, 40px); line-height:1; z-index:3; pointer-events:none;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));
  }
  .item.hate { filter:drop-shadow(0 0 7px rgba(255,70,70,.95)); animation:wiggle .5s ease-in-out infinite; }
  @keyframes wiggle { 0%,100%{ rotate:-7deg } 50%{ rotate:7deg } }
  .item.caught { animation:caught .26s forwards; }
  @keyframes caught { to { scale:1.9; opacity:0; } }
  .item.boom { animation:boom .3s forwards; }
  @keyframes boom { 30%{ scale:1.5; rotate:20deg } to { scale:.2; opacity:0; rotate:90deg } }
  .item.zapped { animation:zapped .28s forwards; }
  @keyframes zapped { to { translate:0 -70px; scale:.3; opacity:0; rotate:180deg } }

  #player {
    position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
    z-index:5; transition:left .11s ease-out; text-align:center; pointer-events:none;
  }
  #playerEmoji { font-size:clamp(44px, 12vw, 54px); line-height:1; display:block; filter:drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
  #player.stunned #playerEmoji { animation:stunShake .12s infinite; filter:grayscale(1) drop-shadow(0 0 8px rgba(255,60,60,.8)); }
  @keyframes stunShake { 0%{ translate:-4px 0 } 50%{ translate:4px 0 } 100%{ translate:-4px 0 } }
  #shieldRing { position:absolute; inset:-10px -14px; font-size:20px; display:none; align-items:flex-start; justify-content:center; }
  #player.shielded #shieldRing { display:flex; animation:spinRing 1.4s linear infinite; }
  @keyframes spinRing { to { rotate:360deg } }
  #player.powered #playerEmoji { filter:drop-shadow(0 0 14px var(--accent)); }

  #toast {
    position:absolute; top:14px; left:50%; translate:-50% 0; z-index:8; width:max-content; max-width:88%;
    background:rgba(0,0,0,.72); border:1px solid rgba(255,255,255,.15);
    padding:9px 14px; border-radius:14px; font-size:13.5px; font-weight:700; text-align:center;
    opacity:0; transition:opacity .2s, translate .2s; pointer-events:none; line-height:1.35;
  }
  #toast.show { opacity:1; translate:-50% 6px; }

  .float-pts {
    position:absolute; z-index:6; font-size:16px; font-weight:900; color:#7dff9b; pointer-events:none;
    translate:-50% 0; animation:floatUp .7s forwards; text-shadow:0 2px 4px rgba(0,0,0,.6);
  }
  @keyframes floatUp { to { translate:-50% -54px; opacity:0 } }

  #flash { position:absolute; inset:0; z-index:9; pointer-events:none; opacity:0; }
  #flash.red { background:radial-gradient(circle, transparent 30%, rgba(255,40,40,.55)); animation:flashA .35s; }
  #flash.white { background:#fff; animation:flashA .4s; }
  @keyframes flashA { 0%{ opacity:0 } 25%{ opacity:1 } 100%{ opacity:0 } }

  .big-count {
    position:absolute; inset:0; z-index:10; display:none; align-items:center; justify-content:center;
    font-size:90px; font-weight:900; text-shadow:0 8px 30px rgba(0,0,0,.6); pointer-events:none;
  }
  .big-count.on { display:flex; animation:countPop .6s; }
  @keyframes countPop { 0%{ scale:.3; opacity:0 } 40%{ scale:1.15; opacity:1 } 100%{ scale:1 } }

  #gameFoot { display:flex; align-items:center; gap:12px; padding:10px 14px max(12px, env(safe-area-inset-bottom)); }
  #quitBtn { width:46px; height:46px; border-radius:14px; background:rgba(255,255,255,.1); font-size:17px; font-weight:800; flex:none; }
  #powerBtn {
    position:relative; flex:1; height:52px; border-radius:16px; overflow:hidden;
    background:rgba(255,255,255,.1); font-weight:900; font-size:15px; letter-spacing:.03em;
  }
  #powerFill { position:absolute; inset:0; width:0%; background:linear-gradient(90deg, var(--accent), #ff7b54); transition:width .15s; }
  #powerLabel { position:relative; z-index:2; text-shadow:0 1px 3px rgba(0,0,0,.4); }
  #powerBtn.ready { animation:readyPulse .6s infinite; }
  #powerBtn.active { animation:none; outline:3px solid var(--accent); }
  @keyframes readyPulse { 50%{ scale:1.04; filter:brightness(1.25) } }
  .foot-spacer { width:46px; flex:none; }

  #gameArea.shake { animation:shakeA .4s; }
  @keyframes shakeA { 0%,100%{ translate:0 0 } 20%{ translate:-8px 2px } 40%{ translate:8px -2px } 60%{ translate:-6px 1px } 80%{ translate:5px -1px } }

  /* ---------- results ---------- */
  #screen-results { justify-content:center; text-align:center; gap:10px; }
  #resEmoji { font-size:76px; animation:bob 1.6s ease-in-out infinite; }
  #resTitle { font-size:24px; color:var(--accent); }
  #resName { font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.6); }
  #resScore { font-size:64px; font-weight:900; line-height:1; }
  #resBestWrap { font-size:14px; font-weight:700; color:rgba(255,255,255,.7); display:flex; gap:8px; justify-content:center; align-items:center; }
  #newBestChip { background:linear-gradient(135deg,#ffd166,#ff7b54); color:#1a1033; font-size:11px; font-weight:900; padding:4px 9px; border-radius:9px; display:none; animation:readyPulse .7s infinite; }
  #newBestChip.on { display:inline-block; }
  #resRoast {
    font-size:14.5px; font-weight:600; color:rgba(255,255,255,.85); font-style:italic;
    background:rgba(255,255,255,.07); border-radius:14px; padding:12px 16px; margin:6px 0 10px; line-height:1.45;
  }
  #screen-results .btn-col { display:flex; flex-direction:column; gap:10px; }

  /* ---------- race ---------- */
  #screen-race { padding-bottom:10px; }
  #raceHint { font-size:11px; font-weight:700; color:#ffd166; background:rgba(255,209,102,.15); padding:5px 9px; border-radius:9px; }
  #raceTracks { position:relative; display:flex; flex-direction:column; gap:4px; }
  .track-row { display:flex; align-items:center; gap:8px; padding:1px 0; border-radius:12px; transition:background .2s; }
  .track-row:active { background:rgba(255,255,255,.06); }
  .track-row.leader .r-name { color:#ffd166; }
  .track-row.leader .r-name::after { content:" 👑"; }
  .r-label { width:88px; flex:none; display:flex; align-items:center; gap:5px; }
  .r-emoji { font-size:18px; }
  .r-name { font-size:12px; font-weight:800; flex:1; white-space:nowrap; overflow:hidden; }
  .r-medal { font-size:13px; font-weight:900; }
  .r-track {
    position:relative; flex:1; height:29px; border-radius:10px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.07); overflow:visible;
  }
  .r-flag { position:absolute; right:4px; top:50%; translate:0 -50%; font-size:15px; opacity:.75; }
  .r-runner {
    position:absolute; left:0%; top:50%; translate:-6px -50%; font-size:21px; line-height:1; z-index:2;
    transition:left .18s linear; animation:runBob .42s ease-in-out infinite alternate;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
  }
  @keyframes runBob { from{ margin-top:-2px; rotate:-6deg } to{ margin-top:2px; rotate:8deg } }
  .track-row.stalled .r-runner { animation:none; filter:grayscale(.9); }
  .track-row.stalled .r-runner::after { content:"💤"; position:absolute; top:-13px; right:-11px; font-size:12px; }
  .track-row.finished .r-runner { animation:none; rotate:0deg; }
  .cheer-float { position:absolute; z-index:5; font-size:15px; pointer-events:none; translate:-50% 0; animation:floatUp .7s forwards; }

  #raceFeed { flex:1; overflow:hidden; margin-top:8px; display:flex; flex-direction:column; gap:5px; min-height:76px; }
  .feed-line {
    background:rgba(255,255,255,.06); border-left:3px solid rgba(255,255,255,.2);
    border-radius:10px; padding:8px 11px; font-size:12.5px; font-weight:600; line-height:1.4; color:rgba(255,255,255,.85);
  }
  .feed-line.new { border-left-color:#ffd166; background:rgba(255,209,102,.12); color:#fff; animation:feedIn .25s; }
  @keyframes feedIn { from{ translate:0 -8px; opacity:0 } }

  /* ---------- awards ---------- */
  #screen-awards { overflow-y:auto; }
  #screen-awards h2 { text-align:center; font-size:24px; margin:4px 0 14px; }
  #podium { display:flex; align-items:flex-end; justify-content:center; gap:8px; margin-bottom:16px; }
  .pod { display:flex; flex-direction:column; align-items:center; width:88px; }
  .pod .p-emoji { font-size:38px; animation:bob 1.6s infinite; }
  .pod .p-name { font-size:12px; font-weight:800; margin:2px 0 6px; }
  .pod .p-bar {
    width:100%; border-radius:10px 10px 0 0; display:flex; align-items:flex-start; justify-content:center;
    padding-top:6px; font-size:20px; animation:podRise .7s ease-out backwards;
    background:linear-gradient(180deg, rgba(255,209,102,.85), rgba(255,123,84,.5));
  }
  .pod.p2 .p-bar { height:58px; background:linear-gradient(180deg, rgba(200,205,220,.8), rgba(140,150,175,.4)); animation-delay:.15s; }
  .pod.p1 .p-bar { height:84px; }
  .pod.p3 .p-bar { height:42px; background:linear-gradient(180deg, rgba(217,140,90,.85), rgba(160,95,60,.4)); animation-delay:.3s; }
  @keyframes podRise { from{ height:0; opacity:0 } }
  #awardsGrid { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:14px; }
  .award-card {
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); border-radius:15px;
    padding:11px 10px; text-align:center;
  }
  .award-card.win { border-color:#ffd166; background:rgba(255,209,102,.14); box-shadow:0 0 18px rgba(255,209,102,.25); }
  .award-card .a-place { font-size:10px; font-weight:900; color:rgba(255,255,255,.55); letter-spacing:.06em; }
  .award-card .a-emoji { font-size:30px; display:block; margin:2px 0; }
  .award-card .a-name { font-size:14px; font-weight:800; display:block; }
  .award-card .a-award { font-size:11px; font-weight:600; color:#ffd166; line-height:1.35; display:block; margin-top:4px; }
  .award-card .a-champ { font-size:10.5px; font-weight:900; color:#1a1033; background:linear-gradient(135deg,#ffd166,#ff7b54); border-radius:8px; padding:3px 7px; display:inline-block; margin-top:6px; }

  .confetti { position:fixed; z-index:99; font-size:16px; pointer-events:none; animation:confettiFly .95s ease-out forwards; }
  @keyframes confettiFly {
    0% { translate:0 0; opacity:1; rotate:0deg; scale:1; }
    100% { translate:var(--dx) var(--dy); opacity:0; rotate:260deg; scale:.55; }
  }
</style>
</head>
<body>
<div id="app">
  <button id="muteBtn" aria-label="Toggle sound">🔊</button>

  <!-- TITLE -->
  <section id="screen-title" class="screen active">
    <div class="emoji-row"><span>🕴️</span><span>🎀</span><span>🤠</span><span>💄</span><span>👻</span><span>🛻</span><span>✈️</span><span>💉</span><span>🦋</span><span>🌿</span><span>🤖</span></div>
    <h1 class="logo">FAMILY<br>DASH</h1>
    <p class="tagline-main">One family. Eleven legends. Sixty seconds of chaos.</p>
    <div class="mode-cards">
      <button class="mode-card" id="btnModeDash">
        <span class="mc-emoji">🎮</span>
        <span><b>Dash</b><span>Pick your fighter. Catch what you love, dodge what you hate. 60 seconds.</span></span>
      </button>
      <button class="mode-card" id="btnModeRace">
        <span class="mc-emoji">📺</span>
        <span><b>Race Night</b><span>Sit back and watch the whole family compete. Tap to cheer. Awards for all.</span></span>
      </button>
    </div>
    <p class="credits">Made with ❤️ by Kish &amp; Claude</p>
  </section>

  <!-- CHARACTER SELECT -->
  <section id="screen-charselect" class="screen">
    <header class="screen-head">
      <button class="back-btn" data-goto="screen-title">←</button>
      <h2>Who are you?</h2>
    </header>
    <div id="charGrid"></div>
  </section>

  <!-- DASH GAME -->
  <section id="screen-game" class="screen">
    <header id="gameHud">
      <div class="hud-box"><span id="hudTime">60</span></div>
      <div class="hud-mid"><span id="hudScore">0</span><span id="hudCharName"></span></div>
      <div class="hud-box"><span id="hudStreak">×1</span></div>
    </header>
    <div id="gameArea">
      <div class="lane-lines"><i></i><i></i><i></i></div>
      <div id="toast"></div>
      <div id="player"><span id="shieldRing">🛡️</span><span id="playerEmoji">🕴️</span></div>
      <div id="flash"></div>
      <div id="dashCount" class="big-count"></div>
    </div>
    <footer id="gameFoot">
      <button id="quitBtn" aria-label="Quit">✕</button>
      <button id="powerBtn"><i id="powerFill"></i><span id="powerLabel">POWER</span></button>
      <div class="foot-spacer"></div>
    </footer>
  </section>

  <!-- RESULTS -->
  <section id="screen-results" class="screen">
    <div id="resEmoji">🕴️</div>
    <div id="resName">RAHIL</div>
    <h2 id="resTitle">VP of Good Taste</h2>
    <div id="resScore">0</div>
    <div id="resBestWrap"><span>Best: <b id="resBest">0</b></span><span id="newBestChip">NEW BEST!</span></div>
    <p id="resRoast"></p>
    <div class="btn-col">
      <button class="btn" id="btnReplay">🔁 Play Again</button>
      <div class="btn-row">
        <button class="btn ghost" id="btnSwitch">🎭 Switch</button>
        <button class="btn ghost" id="btnHome1">🏠 Home</button>
      </div>
    </div>
  </section>

  <!-- RACE NIGHT -->
  <section id="screen-race" class="screen">
    <header class="screen-head">
      <button class="back-btn" id="raceQuit">←</button>
      <h2>🏁 Race Night</h2>
      <span id="raceHint">tap a runner to cheer!</span>
    </header>
    <div id="raceTracks"></div>
    <div id="raceFeed"></div>
    <div id="raceCount" class="big-count"></div>
  </section>

  <!-- AWARDS -->
  <section id="screen-awards" class="screen">
    <h2>🏆 Family Awards</h2>
    <div id="podium"></div>
    <div id="awardsGrid"></div>
    <div class="btn-row">
      <button class="btn" id="btnRaceAgain">🔁 Race Again</button>
      <button class="btn ghost" id="btnHome2">🏠 Home</button>
    </div>
  </section>
</div>

<script>
'use strict';
/* ================================================================
   FAMILY DASH — all comedy content lives in CHARACTERS below.
   Edit jokes/balance here without touching the engine.
   Open with ?turbo=1 for a sped-up QA mode.
================================================================ */
const TURBO = new URLSearchParams(location.search).has('turbo');

/* ================= audio ================= */
const AudioSys = {
  muted: localStorage.getItem('famdash_muted') === '1',
  ctx: null,
  init(){
    if(!this.ctx){ try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur=0.08, type='sine', vol=0.14, delay=0){
    if(this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  catch(streak){ this.tone(480 + Math.min(streak,20)*18, .07, 'sine', .12); },
  hit(){ this.tone(110, .18, 'sawtooth', .15); },
  zap(){ this.tone(880, .06, 'square', .1); this.tone(1320, .06, 'square', .08, .05); },
  power(){ [523,659,784,1047].forEach((f,i) => this.tone(f, .09, 'triangle', .13, i*0.07)); },
  count(){ this.tone(660, .09, 'sine', .12); },
  go(){ this.tone(1240, .16, 'triangle', .16); },
  cheer(){ this.tone(740, .06, 'square', .09); this.tone(980, .06, 'square', .09, .05); },
  fanfare(){ [392,523,659,784,1046].forEach((f,i) => this.tone(f, .13, 'triangle', .15, i*0.09)); },
};
document.addEventListener('pointerdown', () => AudioSys.init(), { once:false });

muteBtn.addEventListener('click', () => {

});

/* ================= confetti / toasts / floats ================= */
function confettiAt(x, y, n=14){
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'confetti';
    p.textContent = pick(['🎉','✨','🎊','⭐']);
    p.style.left = x + 'px'; p.style.top = y + 'px';
    p.style.setProperty('--dx', (Math.random()*180 - 90) + 'px');
    p.style.setProperty('--dy', (-(Math.random()*150) - 30) + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 980);
  }
}
function confettiFromEl(el, n){
  const r = el.getBoundingClientRect();
  confettiAt(r.left + r.width/2, r.top + r.height/2, n);
}

let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function floatText(txt, xPct, yPx, cls='float-pts'){
  const f = document.createElement('div');
  f.className = cls; f.textContent = txt;
  f.style.left = xPct + '%'; f.style.top = yPx + 'px';
  $('gameArea').appendChild(f);
  setTimeout(() => f.remove(), 720);
}

/* countdown: 3..2..1..GO! then cb(). alive() lets a quit cancel it. */
function runCountdown(el, alive, cb){
  const steps = ['3','2','1','GO!'];
  let i = 0;
  const step = () => {
    if(!alive()){ el.classList.remove('on'); return; }
    if(i >= steps.length){ el.classList.remove('on'); cb(); return; }
    el.textContent = steps[i];
    el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
    steps[i] === 'GO!' ? AudioSys.go() : AudioSys.count();
    i++;
    setTimeout(step, i >= steps.length ? 500 : 680);
  };
  step();
}

/* ================= character select ================= */
function bestKey(c){ return 'famdash_best_' + c.id; }
function buildCharGrid(){
  const grid = $('charGrid');
  grid.innerHTML = '';
  CHARACTERS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'char-card';
    const best = +(localStorage.getItem(bestKey(c)) || 0);
    b.innerHTML = `${best ? `<span class="cc-best">⭐ ${best}</span>` : ''}
      <span class="cc-emoji">${c.emoji}</span>
      <span class="cc-name">${c.name}</span>
      <span class="cc-tag">${c.tagline}</span>`;
    b.addEventListener('click', () => startDash(c));
    grid.appendChild(b);
  });
}

/* ================= DASH MODE ================= */
let D = null;
const gameArea = $('gameArea'), playerEl = $('player'), powerBtn = $('powerBtn');

function startDash(char){
  cleanupDash();
  applyAccent(char.color);
  D = {
    char, score:0, streak:0, meter:0, lane:1, items:[],
    time:DASH_TIME, spawnIn:500, stunUntil:0,
    powerType:null, powerUntil:0, hateBlockUntil:0,
    raf:null, last:0, over:false, started:false,
  };
  $('playerEmoji').textContent = char.emoji;
  $('hudCharName').textContent = `${char.name} • ${char.power.name}`;
  $('powerLabel').textContent = '⚡ ' + char.power.name;
  playerEl.classList.remove('stunned','shielded','powered');
  powerBtn.classList.remove('ready','active');
  $('powerFill').style.width = '0%';
  $('toast').classList.remove('show');
  setLane(1);
  updateHud();
  showScreen('screen-game');
  runCountdown($('dashCount'), () => D && !D.over, () => {
    D.started = true;
    D.last = performance.now();
    D.raf = requestAnimationFrame(dashTick);
  });
}

function setLane(l){
  if(!D) return;
  D.lane = clamp(l, 0, 2);
  playerEl.style.left = LANE_X[D.lane] + '%';
}

function spawnItem(prog, now, forceLove = false, yStart = -60){
  const hateOk = now > D.hateBlockUntil;
  const isHate = !forceLove && hateOk && Math.random() < 0.36;
  const [emoji] = pick(isHate ? D.char.hates : D.char.loves);
  const lane = (Math.random()*3)|0;
  const el = document.createElement('div');
  el.className = 'item' + (isHate ? ' hate' : '');
  el.textContent = emoji;
  el.style.left = LANE_X[lane] + '%';
  gameArea.appendChild(el);
  D.items.push({ el, hate:isHate, x:LANE_X[lane], y:yStart, v:0.9 + Math.random()*0.25, resolved:false, deadAt:0 });
}

function dashTick(now){
  if(!D || D.over) return;
  const dt = clamp((now - D.last)/1000, 0, 0.05);
  D.last = now;
  const H = gameArea.clientHeight;
  const prog = 1 - D.time/DASH_TIME;

  D.time -= dt;
  if(D.time <= 0){ endDash(); return; }

  // power expiry
  if(D.powerType && now > D.powerUntil) clearPower();

  // time factor (slow-mo powers)
  let tf = 1;
  if(D.powerType === 'slowmo') tf = 0.65;
  if(D.powerType === 'slowmo2') tf = 0.5;

  // spawn
  D.spawnIn -= dt*1000;
  if(D.spawnIn <= 0){
    D.spawnIn = lerp(950, 470, prog) * (0.85 + Math.random()*0.3);
    spawnItem(prog, now);
  }

  // autopilot steering (Kish)
  if(D.powerType === 'auto'){
    let target = null;
    for(const it of D.items){
      if(!it.hate && !it.resolved && it.y < H - 80 && (!target || it.y > target.y)) target = it;
    }
    if(target){
      let nearest = 0, bd = 1e9;
      LANE_X.forEach((x,i) => { const d = Math.abs(x - target.x); if(d < bd){ bd = d; nearest = i; } });
      if(nearest !== D.lane) setLane(nearest);
    }
  }

  const speed = H * lerp(0.42, 0.74, prog) * tf;
  const playerX = LANE_X[D.lane];
  const catchTop = H - 112, catchBot = H - 24;
  const stunned = now < D.stunUntil;

  for(const it of D.items){
    if(it.resolved){
      if(it.deadAt && now > it.deadAt) it.dead = true;
      continue;
    }
    it.y += speed * it.v * dt;
    if(D.powerType === 'magnet' && !it.hate){
      it.x += (playerX - it.x) * Math.min(1, dt*7);
      it.el.style.left = it.x + '%';
    }
    it.el.style.transform = `translate(-50%, ${it.y}px)`;
    if(it.y >= catchTop && it.y <= catchBot && Math.abs(it.x - playerX) < 13 && !stunned){
      resolveItem(it, now, catchTop);
    } else if(it.y > H + 40){
      it.resolved = true; it.dead = true;
    }
  }
  D.items = D.items.filter(it => { if(it.dead){ it.el.remove(); return false; } return true; });

  playerEl.classList.toggle('stunned', now < D.stunUntil);
  playerEl.classList.toggle('powered', !!D.powerType);
  updateHud();
  D.raf = requestAnimationFrame(dashTick);
}

function resolveItem(it, now, catchTop){
  it.resolved = true;
  if(!it.hate){
    const mult = 1 + Math.min(4, Math.floor(D.streak/5));
    let pts = 10 * mult;
    if(D.powerType === 'double') pts *= 2;
    if(D.powerType === 'slowmo') pts += 5;
    D.score += pts;
    D.streak++;
    if(!D.powerType) D.meter = Math.min(POWER_NEED, D.meter + 1); // meter pauses while a power runs — no perma-chains
    AudioSys.catch(D.streak);
    floatText('+' + pts, it.x, catchTop);
    it.el.classList.add('caught');
    it.deadAt = now + 260;
    if(D.streak % 8 === 0) toast(pick(D.char.lines.streak));
    if(D.meter >= POWER_NEED && !D.powerType) powerBtn.classList.add('ready');
  } else {
    const p = D.powerType;
    if(p === 'munch'){
      // Abhi eats everything — hates count as catches
      const mult = 1 + Math.min(4, Math.floor(D.streak/5));
      const pts = 10 * mult;
      D.score += pts;
      D.streak++;
      AudioSys.catch(D.streak);
      floatText('+' + pts, it.x, catchTop);
      it.el.classList.add('caught');
      it.deadAt = now + 260;
    } else if(p === 'shield' || p === 'invincible' || p === 'auto'){
      it.el.classList.add('zapped');
      it.deadAt = now + 280;
      AudioSys.zap();
      if(p === 'invincible'){
        D.score += 5;
        floatText('+5', it.x, catchTop);
        gameArea.classList.remove('shake'); void gameArea.offsetWidth; gameArea.classList.add('shake');
      }
    } else {
      D.streak = 0;
      D.stunUntil = now + 700;
      it.el.classList.add('boom');
      it.deadAt = now + 300;
      AudioSys.hit();
      const f = $('flash'); f.className = ''; void f.offsetWidth; f.className = 'red';
      toast(pick(D.char.lines.hit));
    }
  }
}

function activatePower(){
  if(!D || D.over || !D.started || D.meter < POWER_NEED || D.powerType) return;
  const now = performance.now();
  const t = D.char.power.type;
  D.meter = 0;
  powerBtn.classList.remove('ready');
  AudioSys.power();
  toast(pick(D.char.lines.power));
  if(t === 'scare'){
    const f = $('flash'); f.className = ''; void f.offsetWidth; f.className = 'white';
    for(const it of D.items){
      if(it.hate && !it.resolved){ it.resolved = true; it.el.classList.add('zapped'); it.deadAt = now + 300; }
    }
    D.hateBlockUntil = now + 2500;
  } else if(t === 'convert'){
    // Nikki: every hate on screen gets a makeover into a love
    const f = $('flash'); f.className = ''; void f.offsetWidth; f.className = 'white';
    for(const it of D.items){
      if(it.hate && !it.resolved){
        it.hate = false;
        it.el.classList.remove('hate');
        it.el.textContent = pick(D.char.loves)[0];
      }
    }
    D.hateBlockUntil = now + 2000;
  } else if(t === 'feast'){
    // Yesha: a fresh batch of loves rains down
    for(let i = 0; i < 6; i++) spawnItem(1 - D.time/DASH_TIME, now, true, -60 - i*85);
  } else {
    D.powerType = t;
    D.powerUntil = now + D.char.power.dur * 1000;
    powerBtn.classList.add('active');
    if(t === 'shield' || t === 'invincible') playerEl.classList.add('shielded');
  }
}

function clearPower(){
  D.powerType = null;
  powerBtn.classList.remove('active');
  playerEl.classList.remove('shielded');
  if(D.meter >= POWER_NEED) powerBtn.classList.add('ready');
}

function updateHud(){
  const t = Math.max(0, Math.ceil(D.time));
  const timeEl = $('hudTime');
  timeEl.textContent = '⏱ ' + t;
  timeEl.classList.toggle('low', t <= 10);
  $('hudScore').textContent = D.score;
  const mult = 1 + Math.min(4, Math.floor(D.streak/5));
  $('hudStreak').textContent = (D.streak >= 5 ? '🔥' : '') + '×' + mult;
  $('powerFill').style.width = (D.meter / POWER_NEED * 100) + '%';
}

function cleanupDash(){
  if(D){ D.over = true; if(D.raf) cancelAnimationFrame(D.raf); }
  gameArea.querySelectorAll('.item, .float-pts').forEach(el => el.remove());
  D = null;
}

function endDash(){
  const d = D;
  d.over = true;
  if(d.raf) cancelAnimationFrame(d.raf);
  AudioSys.fanfare();
  const key = bestKey(d.char);
  const prev = +(localStorage.getItem(key) || 0);
  const isBest = d.score > prev;
  if(isBest) localStorage.setItem(key, String(d.score));
  const tier = d.score < 200 ? 0 : d.score < 450 ? 1 : d.score < 750 ? 2 : 3;
  $('resEmoji').textContent = d.char.emoji;
  $('resName').textContent = d.char.name.toUpperCase();
  $('resTitle').textContent = d.char.titles[tier];
  $('resScore').textContent = d.score;
  $('resBest').textContent = Math.max(prev, d.score);
  $('newBestChip').classList.toggle('on', isBest && d.score > 0);
  $('resRoast').textContent = '“' + pick(d.char.lines.results) + '”';
  gameArea.querySelectorAll('.item, .float-pts').forEach(el => el.remove());
  showScreen('screen-results');
  if(isBest && d.score > 0) confettiFromEl($('resScore'), 20);
}

/* dash input — keyboard */
document.addEventListener('keydown', e => {
  if(!D || D.over || !document.getElementById('screen-game').classList.contains('active')) return;
  if(e.key === 'ArrowLeft'){ setLane(D.lane - 1); e.preventDefault(); }
  else if(e.key === 'ArrowRight'){ setLane(D.lane + 1); e.preventDefault(); }
  else if(e.key === ' '){ activatePower(); e.preventDefault(); }
});

/* dash input — touch/click: tap halves or swipe */
let touchStart = null;
gameArea.addEventListener('pointerdown', e => {
  touchStart = { x: e.clientX, y: e.clientY };
});
gameArea.addEventListener('pointerup', e => {
  if(!D || D.over || !D.started || !touchStart) return;
  const dx = e.clientX - touchStart.x;
  if(Math.abs(dx) > 24){
    setLane(D.lane + (dx > 0 ? 1 : -1));
  } else {
    const r = gameArea.getBoundingClientRect();
    setLane(D.lane + (touchStart.x < r.left + r.width/2 ? -1 : 1));
  }
  touchStart = null;
});
gameArea.addEventListener('touchmove', e => e.preventDefault(), { passive:false });

powerBtn.addEventListener('click', activatePower);
$('quitBtn').addEventListener('click', () => { cleanupDash(); showScreen('screen-title'); });

/* ================= RACE NIGHT ================= */
let R = null;
const RACE_BASE = 1.18; // % per sim-second → ~85s race
const RACE_SP = TURBO ? 8 : 1;

function startRace(){
  cleanupRace();
  applyAccent('#ffd166');
  const tracks = $('raceTracks');
  tracks.innerHTML = '';
  $('raceFeed').innerHTML = '';
  R = {
    runners: [], simNow:0, eventIn:2200, endAt:Infinity,
    finishCount:0, raf:null, last:0, over:false, started:false,
  };
  CHARACTERS.forEach(c => {
    const row = document.createElement('div');
    row.className = 'track-row';
    row.innerHTML = `
      <div class="r-label"><span class="r-emoji">${c.emoji}</span><span class="r-name">${c.name}</span><span class="r-medal"></span></div>
      <div class="r-track"><span class="r-flag">🏁</span><div class="r-runner">${c.emoji}</div></div>`;
    tracks.appendChild(row);
    const runner = {
      c, prog:0, form:1, stallUntil:0, cheerUntil:0, finished:false, place:0,
      row, runnerEl: row.querySelector('.r-runner'), medalEl: row.querySelector('.r-medal'),
    };
    row.addEventListener('pointerdown', () => cheer(runner));
    R.runners.push(runner);
  });
  showScreen('screen-race');
  runCountdown($('raceCount'), () => R && !R.over, () => {
    R.started = true;
    R.last = performance.now();
    feed("🏁 And they're OFF!");
    R.raf = requestAnimationFrame(raceTick);
  });
}

function feed(text){
  const el = $('raceFeed');
  el.querySelectorAll('.feed-line').forEach(l => l.classList.remove('new'));
  const line = document.createElement('div');
  line.className = 'feed-line new';
  line.textContent = text;
  el.prepend(line);
  while(el.children.length > 6) el.lastChild.remove();
}

function cheer(r){
  if(!R || R.over || !R.started || r.finished) return;
  if(R.simNow < r.cheerUntil) return;
  r.cheerUntil = R.simNow + 1.2;
  r.prog = Math.min(99.5, r.prog + 1.3);
  AudioSys.cheer();
  confettiFromEl(r.runnerEl, 7);
  const f = document.createElement('div');
  f.className = 'cheer-float'; f.textContent = '🎉';
  f.style.left = r.prog + '%'; f.style.top = '-4px';
  r.runnerEl.parentElement.appendChild(f);
  setTimeout(() => f.remove(), 720);
}

function fireRaceEvent(){
  const unfinished = R.runners.filter(r => !r.finished);
  if(!unfinished.length) return;
  if(Math.random() < 0.18){
    const ev = pick(GLOBAL_EVENTS);
    let targets = [];
    if(ev.type === 'pair') targets = unfinished.filter(r => ev.ids.includes(r.c.id));
    else if(ev.type === 'all') targets = unfinished;
    else if(ev.type === 'allbut') targets = unfinished.filter(r => r.c.id !== ev.id);
    if(targets.length >= (ev.type === 'pair' ? 2 : 1)){
      targets.forEach(t => {
        if(ev.good) t.prog = Math.min(99.5, t.prog + 2.2 + Math.random()*1.6);
        else t.stallUntil = R.simNow + 1.4 + Math.random();
      });
      feed(ev.text);
      return;
    }
  }
  const r = pick(unfinished);
  const good = Math.random() < 0.5;
  feed(pick(good ? r.c.race.good : r.c.race.bad));
  if(good) r.prog = Math.min(99.5, r.prog + 2.5 + Math.random()*2.2);
  else r.stallUntil = R.simNow + 1.6 + Math.random()*1.2;
}

function raceTick(now){
  if(!R || R.over) return;
  const dt = clamp((now - R.last)/1000, 0, 0.05);
  R.last = now;
  const sdt = dt * RACE_SP;
  R.simNow += sdt;

  R.eventIn -= sdt * 1000;
  if(R.eventIn <= 0){
    R.eventIn = 2600 + Math.random()*1800;
    fireRaceEvent();
  }

  const leadProg = Math.max(...R.runners.map(r => r.prog));
  let leader = null, leaderProg = -1;

  for(const r of R.runners){
    if(!r.finished && r.prog > leaderProg){ leaderProg = r.prog; leader = r; }
    if(r.finished) continue;
    if(R.simNow < r.stallUntil){ r.row.classList.add('stalled'); continue; }
    r.row.classList.remove('stalled');
    r.form = clamp(r.form + (Math.random() - 0.5) * sdt * 0.5, 0.75, 1.3);
    let sp = RACE_BASE * r.form * (1 + (leadProg - r.prog) * 0.005);
    r.prog += sp * sdt;
    if(r.prog >= 100){
      r.prog = 100;
      r.finished = true;
      r.place = ++R.finishCount;
      r.row.classList.remove('stalled');
      r.row.classList.add('finished');
      const medal = ['🥇','🥈','🥉'][r.place - 1] || '#' + r.place;
      r.medalEl.textContent = medal;
      feed(`${medal} ${r.c.name} crosses the finish line!`);
      if(r.place === 1){
        AudioSys.fanfare();
        confettiFromEl(r.runnerEl, 18);
        R.endAt = R.simNow + 8;
      } else {
        AudioSys.zap();
      }
      if(R.finishCount === R.runners.length) R.endAt = R.simNow;
    }
    r.runnerEl.style.left = r.prog + '%';
  }

  R.runners.forEach(r => r.row.classList.toggle('leader', !R.finishCount && r === leader));

  if(R.simNow >= R.endAt){ endRace(); return; }
  R.raf = requestAnimationFrame(raceTick);
}

function endRace(){
  R.over = true;
  if(R.raf) cancelAnimationFrame(R.raf);
  const finished = R.runners.filter(r => r.finished).sort((a,b) => a.place - b.place);
  const rest = R.runners.filter(r => !r.finished).sort((a,b) => b.prog - a.prog);
  const order = [...finished, ...rest];
  order.forEach((r,i) => r.place = i + 1);

  const podium = $('podium');
  podium.innerHTML = '';
  const slots = [[order[1],'p2','🥈'],[order[0],'p1','🥇'],[order[2],'p3','🥉']];
  slots.forEach(([r, cls, medal]) => {
    if(!r) return;
    const div = document.createElement('div');
    div.className = 'pod ' + cls;
    div.innerHTML = `<span class="p-emoji">${r.c.emoji}</span><span class="p-name">${r.c.name}</span><div class="p-bar">${medal}</div>`;
    podium.appendChild(div);
  });

  const grid = $('awardsGrid');
  grid.innerHTML = '';
  order.forEach(r => {
    const card = document.createElement('div');
    card.className = 'award-card' + (r.place === 1 ? ' win' : '');
    card.innerHTML = `<span class="a-place">P${r.place}</span>
      <span class="a-emoji">${r.c.emoji}</span>
      <span class="a-name">${r.c.name}</span>
      <span class="a-award">${r.c.award}</span>
      ${r.place === 1 ? '<span class="a-champ">🏆 FAMILY CHAMPION</span>' : ''}`;
    grid.appendChild(card);
  });

  showScreen('screen-awards');
  AudioSys.fanfare();
  setTimeout(() => confettiFromEl($('podium'), 24), 350);
}

function cleanupRace(){
  if(R){ R.over = true; if(R.raf) cancelAnimationFrame(R.raf); }
  R = null;
}

$('raceQuit').addEventListener('click', () => { cleanupRace(); showScreen('screen-title'); });
$('btnRaceAgain').addEventListener('click', startRace);
$('btnHome2').addEventListener('click', () => { cleanupRace(); showScreen('screen-title'); });

/* ================= navigation ================= */
$('btnModeDash').addEventListener('click', () => { buildCharGrid(); showScreen('screen-charselect'); });
$('btnModeRace').addEventListener('click', startRace);
$('btnReplay').addEventListener('click', () => { const c = D ? D.char : null; startDash(c || CHARACTERS[0]); });
$('btnSwitch').addEventListener('click', () => { cleanupDash(); buildCharGrid(); showScreen('screen-charselect'); });
$('btnHome1').addEventListener('click', () => { cleanupDash(); showScreen('screen-title'); });
document.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => showScreen(b.dataset.goto)));
